<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ssWindowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1210" />
      <stop offset="100%" stop-color="#080A09" />
    </linearGradient>
    <linearGradient id="ssCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18201A" />
      <stop offset="100%" stop-color="#121713" />
    </linearGradient>
    <filter id="ssShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="#0C0E0D" />

  <!-- Browser Window Wrapper -->
  <g filter="url(#ssShadow)">
    <rect x="60" y="40" width="1080" height="720" rx="14" fill="url(#ssWindowBg)" stroke="#232C24" stroke-width="1.5" />
    
    <!-- Browser Top Bar -->
    <rect x="60" y="40" width="1080" height="46" rx="14" fill="#141A15" />
    <path d="M 60 72 L 60 86 L 1140 86 L 1140 72 Z" fill="#141A15" />
    <line x1="60" y1="86" x2="1140" y2="86" stroke="#232C24" stroke-width="1" />

    <!-- Window Control Dots -->
    <circle cx="86" cy="63" r="5.5" fill="#FF5F56" />
    <circle cx="104" cy="63" r="5.5" fill="#FFBD2E" />
    <circle cx="122" cy="63" r="5.5" fill="#27C93F" />

    <!-- URL Bar -->
    <rect x="240" y="52" width="600" height="24" rx="6" fill="#0B0E0C" stroke="#232C24" stroke-width="1" />
    <circle cx="256" cy="64" r="3" fill="#6F853B" />
    <text x="268" y="68" fill="#A4B399" font-family="'JetBrains Mono', monospace" font-size="11">https://samadhan-setu-g8en.onrender.com</text>
  </g>

  <!-- Platform Web Navigation Bar -->
  <g transform="translate(60, 86)">
    <rect x="0" y="0" width="1080" height="64" fill="#101512" stroke="#1E2720" stroke-width="1" />
    
    <!-- Logo -->
    <rect x="40" y="18" width="28" height="28" rx="6" fill="#6F853B" />
    <path d="M 48 32 L 54 24 L 60 32 Z" fill="#0F1210" />
    <text x="78" y="37" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-weight="700" font-size="16">Samadhan Setu <tspan fill="#BFDF64" font-weight="500">AI</tspan></text>
    
    <!-- Navigation Links -->
    <text x="500" y="37" fill="#BFDF64" font-family="'Manrope', sans-serif" font-weight="600" font-size="13">Report Grievance</text>
    <text x="650" y="37" fill="#889680" font-family="'Manrope', sans-serif" font-weight="500" font-size="13">Track Status</text>
    <text x="760" y="37" fill="#889680" font-family="'Manrope', sans-serif" font-weight="500" font-size="13">Departments</text>
    <text x="880" y="37" fill="#889680" font-family="'Manrope', sans-serif" font-weight="500" font-size="13">Citizen Help</text>

    <!-- Sign In Button -->
    <rect x="990" y="16" width="50" height="32" rx="6" fill="#1F2821" stroke="#2E3B30" stroke-width="1" />
    <text x="1015" y="36" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Login</text>
  </g>

  <!-- Hero Section of Platform -->
  <g transform="translate(100, 180)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#1B261D" stroke="#354A37" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#BFDF64" />
    <text x="26" y="17" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">CIVIC GRIEVANCE REDRESSAL PLATFORM</text>

    <!-- Hero Title -->
    <text x="0" y="65" fill="#E3EBD8" font-family="'Newsreader', Georgia, serif" font-size="38" font-weight="500">
      Bridge the Gap Between Citizens &amp; <tspan font-style="italic" fill="#BFDF64">Authorities</tspan>
    </text>
    <text x="0" y="98" fill="#8C9C84" font-family="'Manrope', sans-serif" font-size="14" font-weight="400">
      Report public infrastructure problems in plain language. AI handles departmental triage, routing, and transparent resolution tracking.
    </text>

    <!-- Main Live Triage Demo Card -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="1000" height="370" rx="12" fill="url(#ssCardGrad)" stroke="#263428" stroke-width="1.5" />

      <!-- Left Input Panel -->
      <g transform="translate(30, 30)">
        <text x="0" y="20" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">INPUT: CITIZEN REPORT</text>
        <rect x="0" y="32" width="450" height="90" rx="8" fill="#0C100D" stroke="#1D261F" stroke-width="1" />
        <text x="16" y="60" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-size="13">
          &quot;Main water supply pipe burst outside Sector 14 Market.
        </text>
        <text x="16" y="82" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-size="13">
          Heavy waterlogging flooding shops and road since 6 AM.&quot;
        </text>

        <!-- Geo tag -->
        <rect x="0" y="132" width="180" height="28" rx="6" fill="#141B15" stroke="#253227" stroke-width="1" />
        <circle cx="14" cy="146" r="3.5" fill="#6F853B" />
        <text x="24" y="150" fill="#9FB094" font-family="'JetBrains Mono', monospace" font-size="10">SECTOR 14 • WARD 12</text>

        <!-- Urgency -->
        <rect x="190" y="132" width="130" height="28" rx="6" fill="#2E1C16" stroke="#5E3120" stroke-width="1" />
        <text x="255" y="150" fill="#FF845E" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">URGENCY: HIGH</text>

        <!-- Submit Button -->
        <rect x="0" y="180" width="450" height="42" rx="8" fill="#6F853B" />
        <text x="225" y="206" fill="#0C100D" font-family="'Manrope', sans-serif" font-weight="700" font-size="13" text-anchor="middle">File Grievance &amp; Auto-Route →</text>
      </g>

      <!-- Vertical Divider -->
      <line x1="510" y1="30" x2="510" y2="340" stroke="#1F2A21" stroke-width="1" stroke-dasharray="4 4" />

      <!-- Right Output & Tracking Panel -->
      <g transform="translate(540, 30)">
        <text x="0" y="20" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">AI DEPARTMENTAL ROUTING &amp; DISPATCH</text>
        
        <rect x="0" y="32" width="430" height="65" rx="8" fill="#131B15" stroke="#2B3C2D" stroke-width="1.5" />
        <text x="16" y="56" fill="#889880" font-family="'JetBrains Mono', monospace" font-size="10">ASSIGNED AUTHORITY</text>
        <text x="16" y="78" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Municipal Water Works &amp; Sanitation Board</text>

        <!-- Resolution Progress Stepper -->
        <g transform="translate(0, 120)">
          <!-- Line -->
          <line x1="20" y1="16" x2="380" y2="16" stroke="#253528" stroke-width="2" />
          <line x1="20" y1="16" x2="260" y2="16" stroke="#BFDF64" stroke-width="2" />

          <!-- Step 1 -->
          <circle cx="20" cy="16" r="10" fill="#BFDF64" />
          <circle cx="20" cy="16" r="4" fill="#0F1410" />
          <text x="20" y="38" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">REPORTED</text>

          <!-- Step 2 -->
          <circle cx="140" cy="16" r="10" fill="#BFDF64" />
          <circle cx="140" cy="16" r="4" fill="#0F1410" />
          <text x="140" y="38" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">AI TRIAGED</text>

          <!-- Step 3 -->
          <circle cx="260" cy="16" r="10" fill="#BFDF64" />
          <circle cx="260" cy="16" r="4" fill="#0F1410" />
          <text x="260" y="38" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">DISPATCHED</text>

          <!-- Step 4 -->
          <circle cx="380" cy="16" r="10" fill="#1A241C" stroke="#334636" stroke-width="1.5" />
          <text x="380" y="38" fill="#697963" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">RESOLVED</text>
        </g>

        <!-- Live Audit Trail Log -->
        <rect x="0" y="185" width="430" height="90" rx="6" fill="#0B0E0C" stroke="#1D261F" stroke-width="1" />
        <text x="14" y="206" fill="#889880" font-family="'JetBrains Mono', monospace" font-size="10">AUDIT LEDGER: #SS-2026-894</text>
        <text x="14" y="226" fill="#E3EBD8" font-family="'JetBrains Mono', monospace" font-size="11">✓ Severity Confidence Score: 98.4% (Critical Hazard)</text>
        <text x="14" y="244" fill="#E3EBD8" font-family="'JetBrains Mono', monospace" font-size="11">✓ Assigned to Sub-Divisional Engineer, Ward 12</text>
        <text x="14" y="262" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="11">→ Public status ledger synchronized in real time</text>
      </g>
    </g>
  </g>
</svg>
