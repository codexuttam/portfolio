      <circle cx="20" cy="36" r="4" fill="#73756E" />
      <text x="36" y="28" fill="#E9E7E1" font-family="'Manrope', sans-serif" font-weight="600" font-size="13">Solid Waste Bin Overflow Complaint</text>
      <text x="36" y="48" fill="#73756E" font-family="'JetBrains Mono', monospace" font-size="11">SLA: 12h • Sanitation Services • Scheduled</text>
