<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="samadhanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231F1B" />
      <stop offset="50%" stop-color="#1B1714" />
      <stop offset="100%" stop-color="#13100E" />
    </linearGradient>
    <pattern id="samadhanGrid" width="48" height="48" patternUnits="userSpaceOnUse">
