<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="qlWindowBg" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#0F1410" />
      <stop offset="100%" stop-color="#080C09" />
    </linearGradient>
    <linearGradient id="qlCardGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#162219" />
      <stop offset="100%" stop-color="#101812" />
    </linearGradient>
    <filter id="qlShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="#0C0E0D" />

  <!-- Browser Window Wrapper -->
  <g filter="url(#qlShadow)">
    <rect x="60" y="40" width="1080" height="720" rx="14" fill="url(#qlWindowBg)" stroke="#243427" stroke-width="1.5" />
    
    <!-- Browser Top Bar -->
    <rect x="60" y="40" width="1080" height="46" rx="14" fill="#151E17" />
    <path d="M 60 72 L 60 86 L 1140 86 L 1140 72 Z" fill="#151E17" />
    <line x1="60" y1="86" x2="1140" y2="86" stroke="#243427" stroke-width="1" />

    <!-- Window Control Dots -->
    <circle cx="86" cy="63" r="5.5" fill="#FF5F56" />
    <circle cx="104" cy="63" r="5.5" fill="#FFBD2E" />
    <circle cx="122" cy="63" r="5.5" fill="#27C93F" />

    <!-- URL Bar -->
    <rect x="240" y="52" width="600" height="24" rx="6" fill="#0B0F0C" stroke="#243427" stroke-width="1" />
    <circle cx="256" cy="64" r="3" fill="#6F853B" />
    <text x="268" y="68" fill="#A4B399" font-family="'JetBrains Mono', monospace" font-size="11">https://quicklearn-ai-three.vercel.app</text>
  </g>

  <!-- Platform Web Navigation Bar -->
  <g transform="translate(60, 86)">
    <rect x="0" y="0" width="1080" height="64" fill="#101712" stroke="#1F2E22" stroke-width="1" />
    
    <!-- Logo -->
    <rect x="40" y="18" width="28" height="28" rx="6" fill="#6F853B" />
    <path d="M 54 22 L 48 32 L 53 32 L 51 40 L 60 29 L 55 29 Z" fill="#0F1410" />
    <text x="78" y="37" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-weight="700" font-size="16">QuickLearn <tspan fill="#BFDF64">AI</tspan></text>
    
    <!-- Navigation Links -->
    <text x="490" y="37" fill="#BFDF64" font-family="'Manrope', sans-serif" font-weight="600" font-size="13">Interactive Tutor</text>
    <text x="640" y="37" fill="#889880" font-family="'Manrope', sans-serif" font-weight="500" font-size="13">Adaptive Drills</text>
    <text x="770" y="37" fill="#889880" font-family="'Manrope', sans-serif" font-weight="500" font-size="13">Concept Graphs</text>
    <text x="900" y="37" fill="#889880" font-family="'Manrope', sans-serif" font-weight="500" font-size="13">Retention Track</text>

    <!-- Sign In Button -->
    <rect x="990" y="16" width="50" height="32" rx="6" fill="#1F2E23" stroke="#324937" stroke-width="1" />
    <text x="1015" y="36" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Study</text>
  </g>

  <!-- Hero Content Section -->
  <g transform="translate(100, 180)">
    <!-- Badge -->
    <rect x="0" y="0" width="290" height="26" rx="13" fill="#1B261D" stroke="#354A37" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#BFDF64" />
    <text x="26" y="17" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">INTERACTIVE LLM LEARNING ASSISTANT</text>

    <!-- Headline -->
    <text x="0" y="65" fill="#E3EBD8" font-family="'Newsreader', Georgia, serif" font-size="38" font-weight="500">
      Not Just a Wrapper. An Interactive <tspan font-style="italic" fill="#BFDF64">Tutor</tspan>.
    </text>
    <text x="0" y="98" fill="#8C9C84" font-family="'Manrope', sans-serif" font-size="14" font-weight="400">
      Make learning faster, personalized, and structured using LLM-powered concept maps, Socratic diagnostics, and adaptive retention loops.
    </text>

    <!-- Interactive Tutor Platform Workspace -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="1000" height="370" rx="12" fill="url(#qlCardGrad)" stroke="#293D2D" stroke-width="1.5" />

      <!-- Left Sidebar: Concept Tree -->
      <g transform="translate(24, 24)">
        <rect x="0" y="0" width="230" height="322" rx="8" fill="#0C120E" stroke="#1D2A20" stroke-width="1" />
        <text x="16" y="28" fill="#889880" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">CURRICULUM BREAKDOWN</text>

        <rect x="12" y="44" width="206" height="36" rx="6" fill="#1E2B21" stroke="#384E3D" stroke-width="1" />
        <text x="22" y="66" fill="#BFDF64" font-family="'Manrope', sans-serif" font-size="12" font-weight="600">1. Attention Mechanism</text>

        <text x="22" y="110" fill="#8C9C84" font-family="'Manrope', sans-serif" font-size="12">2. Multi-Head Projections</text>
        <text x="22" y="148" fill="#8C9C84" font-family="'Manrope', sans-serif" font-size="12">3. Positional Encodings</text>
        <text x="22" y="186" fill="#8C9C84" font-family="'Manrope', sans-serif" font-size="12">4. Layer Normalization</text>
        <text x="22" y="224" fill="#8C9C84" font-family="'Manrope', sans-serif" font-size="12">5. Residual Connections</text>

        <rect x="12" y="260" width="206" height="38" rx="6" fill="#141E16" stroke="#253828" stroke-width="1" />
        <text x="22" y="284" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="10">MASTERY LEVEL: 86%</text>
      </g>

      <!-- Center Chat & Socratic Workspace -->
      <g transform="translate(276, 24)">
        <rect x="0" y="0" width="460" height="322" rx="8" fill="#0C120E" stroke="#1D2A20" stroke-width="1" />
        <text x="20" y="28" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">SOCRATIC INTERACTION CANVAS</text>

        <!-- Tutor Prompt -->
        <rect x="16" y="44" width="428" height="66" rx="8" fill="#141F17" stroke="#283C2C" stroke-width="1" />
        <text x="32" y="68" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-size="12" font-weight="600">
          TUTOR: Why split attention across 8 heads instead of 1 large vector?
        </text>
        <text x="32" y="90" fill="#889880" font-family="'Manrope', sans-serif" font-size="11">
          Think about how different syntactic and semantic relations are captured.
        </text>

        <!-- Student Attempt -->
        <rect x="16" y="122" width="428" height="60" rx="8" fill="#101712" stroke="#202F23" stroke-width="1" />
        <text x="32" y="146" fill="#A4B399" font-family="'Manrope', sans-serif" font-size="12">
          &quot;It lets the model attend to information from different representation
        </text>
        <text x="32" y="166" fill="#A4B399" font-family="'Manrope', sans-serif" font-size="12">
          subspaces simultaneously at different positions.&quot;
        </text>

        <!-- AI Real-Time Feedback -->
        <rect x="16" y="194" width="428" height="66" rx="8" fill="#19281D" stroke="#3A583E" stroke-width="1.5" />
        <text x="32" y="218" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">
          ✓ ACCURATE INSIGHT (+15 XP)
        </text>
        <text x="32" y="238" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-size="11">
          Spot on. Head 1 tracks syntax while Head 4 correlates long-range coreference.
        </text>

        <!-- Next Challenge button -->
        <rect x="16" y="272" width="428" height="34" rx="6" fill="#6F853B" />
        <text x="230" y="294" fill="#0C120E" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Continue to Next Practice Challenge →</text>
      </g>

      <!-- Right Panel: Spaced Repetition -->
      <g transform="translate(758, 24)">
        <rect x="0" y="0" width="218" height="322" rx="8" fill="#0C120E" stroke="#1D2A20" stroke-width="1" />
        <text x="16" y="28" fill="#889880" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">RETENTION SCHEDULE</text>

        <rect x="12" y="44" width="194" height="110" rx="6" fill="#141E16" stroke="#253828" stroke-width="1" />
        <text x="20" y="70" fill="#889880" font-family="'JetBrains Mono', monospace" font-size="10">SPACED DRILL</text>
        <text x="20" y="96" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-size="18" font-weight="700">SM-2 Algorithm</text>
        <text x="20" y="122" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="10">NEXT REVIEW: 2 DAYS</text>
        <text x="20" y="140" fill="#889880" font-family="'Manrope', sans-serif" font-size="10">Confidence: 94.2%</text>

        <!-- Active Flashcards -->
        <rect x="12" y="166" width="194" height="74" rx="6" fill="#141E16" stroke="#253828" stroke-width="1" />
        <text x="20" y="190" fill="#889880" font-family="'JetBrains Mono', monospace" font-size="10">KNOWLEDGE CARDS</text>
        <text x="20" y="214" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-size="13" font-weight="600">38 Decks Mastered</text>

        <!-- Start Practice button -->
        <rect x="12" y="254" width="194" height="38" rx="6" fill="#1F2E23" stroke="#3A583E" stroke-width="1" />
        <text x="109" y="278" fill="#BFDF64" font-family="'Manrope', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Flash Revision</text>
      </g>
    </g>
  </g>
</svg>
