      <text x="0" y="32" fill="#E9E7E1" font-family="'Manrope', sans-serif" font-weight="700" font-size="28">Audio &amp; Text</text>
      <text x="0" y="54" fill="#C4E36C" font-family="'JetBrains Mono', monospace" font-size="11">Synced lecture transcript chunks</text>
