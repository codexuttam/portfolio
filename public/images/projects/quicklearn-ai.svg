<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quicklearnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192020" />
      <stop offset="50%" stop-color="#141919" />
      <stop offset="100%" stop-color="#0E1212" />
    </linearGradient>
    <pattern id="quicklearnGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#5A7A77" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <radialGradient id="quicklearnGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5A7A77" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#C4E36C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#141919" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#quicklearnBg)" />
