    <!-- Root Node -->
    <circle cx="120" cy="180" r="26" fill="#1E2625" stroke="#C4E36C" stroke-width="2"/>
    <text x="120" y="184" fill="#E9E7E1" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Calculus</text>

