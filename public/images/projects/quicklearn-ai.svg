    <path d="M 260 110 L 420 80" stroke="#C4E36C" stroke-width="2"/>
    <path d="M 260 110 L 420 160" stroke="#5A7A77" stroke-width="2"/>
    <path d="M 260 250 L 420 250" stroke="#5A7A77" stroke-width="2" stroke-dasharray="4 4"/>

