    <text x="1070" y="10" fill="#5A7A77" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1" text-anchor="end">VECTOR RETRIEVAL • SM-2 ALGORITHM • NEXT.JS</text>
