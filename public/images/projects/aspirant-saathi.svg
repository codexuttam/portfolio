<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="asWindowBg" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#0E1312" />
      <stop offset="100%" stop-color="#080C0B" />
    </linearGradient>
    <linearGradient id="asCardGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#151E1D" />
      <stop offset="100%" stop-color="#101716" />
    </linearGradient>
    <filter id="asShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="#0C0E0D" />

  <!-- Browser Window Wrapper -->
  <g filter="url(#asShadow)">
    <rect x="60" y="40" width="1080" height="720" rx="14" fill="url(#asWindowBg)" stroke="#1F2C2A" stroke-width="1.5" />
    
    <!-- Browser Top Bar -->
    <rect x="60" y="40" width="1080" height="46" rx="14" fill="#131B1A" />
    <path d="M 60 72 L 60 86 L 1140 86 L 1140 72 Z" fill="#131B1A" />
    <line x1="60" y1="86" x2="1140" y2="86" stroke="#1F2C2A" stroke-width="1" />

    <!-- Window Control Dots -->
    <circle cx="86" cy="63" r="5.5" fill="#FF5F56" />
    <circle cx="104" cy="63" r="5.5" fill="#FFBD2E" />
    <circle cx="122" cy="63" r="5.5" fill="#27C93F" />

    <!-- URL Bar -->
    <rect x="240" y="52" width="600" height="24" rx="6" fill="#0A0E0D" stroke="#1F2C2A" stroke-width="1" />
    <circle cx="256" cy="64" r="3" fill="#5A7A77" />
    <text x="268" y="68" fill="#9FB5B3" font-family="'JetBrains Mono', monospace" font-size="11">https://aspirantsaathi.com</text>
  </g>

  <!-- Platform Web Navigation Bar -->
  <g transform="translate(60, 86)">
    <rect x="0" y="0" width="1080" height="64" fill="#101615" stroke="#1C2725" stroke-width="1" />
    
    <!-- Logo -->
    <rect x="40" y="18" width="28" height="28" rx="6" fill="#5A7A77" />
    <path d="M 48 34 L 54 22 L 60 34 Z" fill="#0E1312" />
    <text x="78" y="37" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-weight="700" font-size="16">Aspirant Saathi <tspan fill="#BFDF64" font-weight="500">AI</tspan></text>
    
    <!-- Navigation Links -->
    <text x="490" y="37" fill="#BFDF64" font-family="'Manrope', sans-serif" font-weight="600" font-size="13">Evaluate Answer</text>
    <text x="640" y="37" fill="#889896" font-family="'Manrope', sans-serif" font-weight="500" font-size="13">Marking Rubrics</text>
    <text x="780" y="37" fill="#889896" font-family="'Manrope', sans-serif" font-weight="500" font-size="13">Model Papers</text>
    <text x="910" y="37" fill="#889896" font-family="'Manrope', sans-serif" font-weight="500" font-size="13">Dashboard</text>

    <!-- Sign In Button -->
    <rect x="1000" y="16" width="50" height="32" rx="6" fill="#1D2725" stroke="#2B3A38" stroke-width="1" />
    <text x="1025" y="36" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Start</text>
  </g>

  <!-- Hero Content Section -->
  <g transform="translate(100, 180)">
    <!-- Badge -->
    <rect x="0" y="0" width="340" height="26" rx="13" fill="#152120" stroke="#2C3D3B" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#BFDF64" />
    <text x="26" y="17" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">AI-POWERED ANSWER EVALUATION PLATFORM</text>

    <!-- Headline -->
    <text x="0" y="65" fill="#E3EBD8" font-family="'Newsreader', Georgia, serif" font-size="38" font-weight="500">
      Evaluates What You Write, Not Just <tspan font-style="italic" fill="#BFDF64">Answers</tspan>.
    </text>
    <text x="0" y="98" fill="#889B99" font-family="'Manrope', sans-serif" font-size="14" font-weight="400">
      Automated, examiner-style feedback for competitive exam aspirants with strict rubric scoring, structural breakdown, and model enhancements.
    </text>

    <!-- Interactive Evaluation Workspace -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="1000" height="370" rx="12" fill="url(#asCardGrad)" stroke="#263634" stroke-width="1.5" />

      <!-- Left Panel: Submitted Written Script -->
      <g transform="translate(30, 24)">
        <text x="0" y="20" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SUBMITTED CANDIDATE RESPONSE</text>
        
        <rect x="0" y="32" width="450" height="290" rx="8" fill="#0C100F" stroke="#1D2826" stroke-width="1" />
        
        <!-- Question prompt -->
        <g transform="translate(16, 20)">
          <text x="0" y="0" fill="#5A7A77" font-family="'JetBrains Mono', monospace" font-size="10">Q: DISCUSS LOCAL DECENTRALIZED GOVERNANCE CHALLENGES [20 MARKS]</text>
          
          <line x1="0" y1="12" x2="418" y2="12" stroke="#1C2725" stroke-width="1" />
          
          <text x="0" y="35" fill="#E3EBD8" font-family="'Newsreader', Georgia, serif" font-size="13" font-style="italic">
            &quot;Decentralization through Panchayati Raj has deepened grassroots democracy.
          </text>
          <text x="0" y="55" fill="#E3EBD8" font-family="'Newsreader', Georgia, serif" font-size="13" font-style="italic">
            However, fiscal autonomy remains constrained due to poor tax mobilization
          </text>
          <text x="0" y="75" fill="#E3EBD8" font-family="'Newsreader', Georgia, serif" font-size="13" font-style="italic">
            and bureaucratic interference by state line departments...&quot;
          </text>

          <!-- Annotations on script -->
          <rect x="0" y="100" width="418" height="34" rx="4" fill="#3D291D" stroke="#7A4B29" stroke-width="1" />
          <text x="10" y="122" fill="#FFA566" font-family="'JetBrains Mono', monospace" font-size="10">⚠️ EXAMINER NOTE: Missing mention of 73rd/74th Constitutional Acts</text>

          <rect x="0" y="145" width="418" height="34" rx="4" fill="#1C2E25" stroke="#37634C" stroke-width="1" />
          <text x="10" y="167" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="10">✓ STRONG POINT: Accurate fiscal transfer bottleneck breakdown</text>
        </g>
      </g>

      <!-- Right Panel: Examiner Assessment Card -->
      <g transform="translate(520, 24)">
        <text x="0" y="20" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">DIAGNOSTIC EXAMINER SCORECARD</text>

        <!-- Score summary header -->
        <rect x="0" y="32" width="450" height="74" rx="8" fill="#111A19" stroke="#253835" stroke-width="1.5" />
        <text x="20" y="60" fill="#889896" font-family="'JetBrains Mono', monospace" font-size="10">OVERALL MARKS AWARDED</text>
        <text x="20" y="88" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-weight="700" font-size="22">14.5 <tspan fill="#889896" font-size="14" font-weight="500">/ 20</tspan></text>
        
        <rect x="330" y="46" width="100" height="28" rx="6" fill="#1F2D2B" stroke="#3D5954" stroke-width="1" />
        <text x="380" y="64" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">GRADE: 72.5%</text>

        <!-- Criteria Bars -->
        <g transform="translate(0, 120)">
          <!-- Item 1 -->
          <text x="0" y="14" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-size="11">Conceptual Depth &amp; Accuracy</text>
          <text x="450" y="14" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">7.0 / 8</text>
          <rect x="0" y="22" width="450" height="6" rx="3" fill="#152120" />
          <rect x="0" y="22" width="393" height="6" rx="3" fill="#BFDF64" />

          <!-- Item 2 -->
          <text x="0" y="50" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-size="11">Structure &amp; Introduction Coherence</text>
          <text x="450" y="50" fill="#BFDF64" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">3.5 / 4</text>
          <rect x="0" y="58" width="450" height="6" rx="3" fill="#152120" />
          <rect x="0" y="58" width="393" height="6" rx="3" fill="#BFDF64" />

          <!-- Item 3 -->
          <text x="0" y="86" fill="#E3EBD8" font-family="'Manrope', sans-serif" font-size="11">Case Laws &amp; Policy Citations</text>
          <text x="450" y="86" fill="#FFB088" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">2.0 / 4</text>
          <rect x="0" y="94" width="450" height="6" rx="3" fill="#152120" />
          <rect x="0" y="94" width="225" height="6" rx="3" fill="#FFA566" />
        </g>

        <!-- Recommendations Pill -->
        <rect x="0" y="246" width="450" height="44" rx="6" fill="#0C100F" stroke="#1F2A28" stroke-width="1" />
        <text x="14" y="272" fill="#A0B3B0" font-family="'Manrope', sans-serif" font-size="11">💡 Add 2-3 committee citations (Balwant Rai Mehta / Sarkaria) for +2.5 marks</text>
      </g>
    </g>
  </g>
</svg>
