<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D302A" />
      <stop offset="60%" stop-color="#22251F" />
      <stop offset="100%" stop-color="#191B16" />
    </linearGradient>
    <radialGradient id="mistGlow" cx="48%" cy="58%" r="65%">
      <stop offset="0%" stop-color="#778A43" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#C4E36C" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#191B16" stop-opacity="0" />
    </radialGradient>
    <pattern id="surveyGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E9E7E1" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Sky & Atmosphere -->
  <rect width="1400" height="560" fill="url(#skyGrad)" />
  <rect width="1400" height="560" fill="url(#mistGlow)" />
  <rect width="1400" height="560" fill="url(#surveyGrid)" />

  <!-- Mountain Silhouette Range (Editorial layered horizon) -->
  <!-- Far mountains -->
  <path d="M0 380 Q 240 260 480 340 T 960 300 Q 1200 240 1400 320 L 1400 560 L 0 560 Z" fill="#1C1E19" opacity="0.6" />
  
  <!-- Mid mountains -->
  <path d="M0 420 Q 320 310 620 390 T 1140 350 Q 1280 320 1400 370 L 1400 560 L 0 560 Z" fill="#181A15" opacity="0.8" />

  <!-- Near Ridge with architectural geometric lines -->
  <path d="M0 470 Q 280 410 560 450 T 1080 430 Q 1260 410 1400 440 L 1400 560 L 0 560 Z" fill="#141512" />

  <!-- Architectural Horizon Coordinates & Geometry -->
  <g opacity="0.5">
    <line x1="80" y1="280" x2="1320" y2="280" stroke="#778A43" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="700" cy="280" r="120" stroke="#778A43" stroke-width="1" stroke-dasharray="2 6" />
    <circle cx="700" cy="280" r="4" fill="#C4E36C" />
    <line x1="700" y1="80" x2="700" y2="480" stroke="#778A43" stroke-width="1" stroke-dasharray="2 6" />
  </g>

  <!-- Framing Border and Survey Crop Marks -->
  <rect x="20" y="20" width="1360" height="520" fill="none" stroke="#E9E7E1" stroke-opacity="0.1" stroke-width="1" />
  <path d="M20 50 L20 20 L50 20" stroke="#C4E36C" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M1380 50 L1380 20 L1350 20" stroke="#C4E36C" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M20 510 L20 540 L50 540" stroke="#C4E36C" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M1380 510 L1380 540 L1350 540" stroke="#C4E36C" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Top Metadata Overlay -->
  <g transform="translate(48, 54)">
    <text x="0" y="0" fill="#E9E7E1" opacity="0.7" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2">FIELD STUDY // GEOGRAPHIC SURVEY REF: 28°38'N 77°13'E</text>
    <text x="1304" y="0" fill="#C4E36C" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" text-anchor="end">PANORAMIC PLATE 01</text>
  </g>

  <!-- Minimal Bottom-Right Caption (like rahulgg.in's "Durgam Cheruvu, India") -->
  <g transform="translate(1352, 510)">
    <text x="0" y="0" fill="#E9E7E1" opacity="0.9" font-family="'Manrope', sans-serif" font-weight="600" font-size="13" text-anchor="end">UTTAMRAJ ARCHIVE • INDIA</text>
    <text x="0" y="16" fill="#73756E" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">SURVEY ELEVATION 216M // EDITORIAL HORIZON</text>
  </g>
</svg>
